name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Copy code to Oracle
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "."
          target: "~/no13thfloor"

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keygen -lf ~/.ssh/oracle_key

      - name: SSH and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/oracle_key ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} 'bash -s' <<'DEPLOY_EOF'
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ca-certificates curl git openssl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo systemctl enable --now docker
          fi
          cd ~/no13thfloor
          mkdir -p data reports certs certbot-webroot
          if [ ! -f .env ]; then
            cp .env.example .env
            sed -i "s/replace_with_long_random_string/$(openssl rand -hex 32)/" .env
          fi
          if [ ! -f certs/live/no13thfloor.org/fullchain.pem ]; then
            mkdir -p certs/live/no13thfloor.org
            openssl req -x509 -nodes -days 7 -newkey rsa:2048 \
              -keyout certs/live/no13thfloor.org/privkey.pem \
              -out certs/live/no13thfloor.org/fullchain.pem \
              -subj "/CN=audit.no13thfloor.org" 2>/dev/null
          fi
          sudo docker compose build
          sudo docker compose down
          sudo docker compose up -d
          echo "Waiting for app to become healthy..."
          for i in $(seq 1 30); do
            if sudo docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              echo "app healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "app failed to become healthy in time"
              sudo docker compose logs app | tail -30
              exit 1
            fi
            sleep 10
          done
          DNS_IP=$(getent hosts audit.no13thfloor.org | awk '{print $1}')
          if [ -n "$DNS_IP" ]; then
            echo "DNS resolves audit.no13thfloor.org to $DNS_IP"
            CERTDIR="$HOME/no13thfloor/certs/live/no13thfloor.org"
            HAVE_REAL_CERT=0
            if [ -f "$CERTDIR/fullchain.pem" ] \
              && ! openssl x509 -in "$CERTDIR/fullchain.pem" -noout -issuer 2>/dev/null | grep -q "CN *= *audit.no13thfloor.org" \
              && openssl x509 -in "$CERTDIR/fullchain.pem" -noout -checkend 2592000 2>/dev/null; then
              HAVE_REAL_CERT=1
            fi
            if [ "$HAVE_REAL_CERT" = "1" ]; then
              echo "Real certificate valid for 30+ days; skipping certbot"
            else
              echo "Issuing Let's Encrypt certificate..."
              rm -rf "$CERTDIR.bootstrap.bak"
              if [ -d "$CERTDIR" ]; then
                mv "$CERTDIR" "$CERTDIR.bootstrap.bak"
              fi
              mkdir -p "$CERTDIR"
              if sudo docker run --rm \
                  -v "$HOME/no13thfloor/certs:/etc/letsencrypt" \
                  -v "$HOME/no13thfloor/certbot-webroot:/var/www/certbot" \
                  certbot/certbot certonly --webroot -w /var/www/certbot \
                  --cert-name no13thfloor.org -d audit.no13thfloor.org \
                  --agree-tos -m louievb3@gmail.com --non-interactive; then
                echo "certbot succeeded"
                rm -rf "$CERTDIR.bootstrap.bak"
              else
                echo "certbot FAILED; restoring previous cert"
                rm -rf "$CERTDIR"
                if [ -d "$CERTDIR.bootstrap.bak" ]; then
                  mv "$CERTDIR.bootstrap.bak" "$CERTDIR"
                fi
              fi
              sudo docker compose restart nginx || true
            fi
            echo "TLS step done"
          else
            echo "DNS not resolving yet; keeping bootstrap cert"
          fi
          echo "Deployment complete"
          DEPLOY_EOF
