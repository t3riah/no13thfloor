name: SSH Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Cert state probe
        run: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/oracle_key ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} 'echo === plain ls ===; ls -la ~/no13thfloor/certs/ 2>&1; ls -la ~/no13thfloor/certs/live/ 2>&1; ls -la ~/no13thfloor/certs/live/no13thfloor.org/ 2>&1; echo === namei ===; namei -l ~/no13thfloor/certs/live/no13thfloor.org/fullchain.pem 2>&1; echo === sudo ls ===; sudo ls -la ~/no13thfloor/certs/live/no13thfloor.org/ 2>&1; echo === cert info via sudo ===; sudo openssl x509 -in ~/no13thfloor/certs/live/no13thfloor.org/fullchain.pem -noout -issuer -enddate 2>&1; echo === containers ===; sudo docker ps --format "{{.Names}} {{.Status}}" 2>&1'
