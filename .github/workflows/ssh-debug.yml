name: SSH Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Restore cert and nginx
        run: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/oracle_key ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} 'cd ~/no13thfloor && echo === archives === && sudo ls certs/archive/ && SRC=archive/no13thfloor.org && if sudo test -f certs/archive/no13thfloor.org-0001/fullchain1.pem; then SRC=archive/no13thfloor.org-0001; fi && echo SRC=$SRC && sudo ln -sf ../../$SRC/cert1.pem certs/live/no13thfloor.org/cert.pem && sudo ln -sf ../../$SRC/chain1.pem certs/live/no13thfloor.org/chain.pem && sudo ln -sf ../../$SRC/fullchain1.pem certs/live/no13thfloor.org/fullchain.pem && sudo ln -sf ../../$SRC/privkey1.pem certs/live/no13thfloor.org/privkey.pem && ls -la certs/live/no13thfloor.org/ && sudo openssl x509 -in certs/live/no13thfloor.org/fullchain.pem -noout -issuer -enddate && sudo docker compose restart nginx && sleep 4 && sudo docker ps --format "{{.Names}} {{.Status}}" && curl -s --resolve audit.no13thfloor.org:443:127.0.0.1 https://audit.no13thfloor.org/health && echo && echo RECOVERY_DONE'
